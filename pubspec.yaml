name: easy2eat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_dotenv: ^6.0.1
  http: ^1.2.0
  dio: ^5.7.0
  geolocator: ^14.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^18.0.1
  translator: ^1.0.4+1
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  firebase_storage: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  retrofit_generator: ^10.3.2
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
